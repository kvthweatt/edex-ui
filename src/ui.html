        <!-- Minimal require() shim for browser compatibility -->
        <script>
            // Provide basic require() shim for remaining legacy code
            window.require = function(name) {
                switch(name) {
                    case 'color':
                        return window.Color;
                    case './assets/icons/file-icons.json':
                        return window.fileIcons || {};
                    case './assets/misc/file-icons-match.js':
                        return window.fileIconsMatcher || function() { return 'unknown'; };
                    case 'mime-types':
                        return window.mimeTypes || { lookup: () => 'application/octet-stream', charset: () => null };
                    case 'mime-db':
                        return window.mimeDb || {};
                    case 'path':
                        // Simple path shim for browser
                        return {
                            extname: (p) => {
                                const match = p.match(/\.[^.]*$/);
                                return match ? match[0] : '';
                            },
                            basename: (p) => p.split(/[\\\/]/).pop(),
                            dirname: (p) => p.replace(/[\\\/][^\\\/]*$/, ''),
                            join: (...args) => args.join('/').replace(/\/+/g, '/'),
                            resolve: (...args) => args.join('/').replace(/\/+/g, '/')
                        };
                    case 'fs':
                        // Minimal fs shim for addons that check for fs existence
                        return { existsSync: () => false, readFileSync: () => '', writeFileSync: () => {} };
                    case 'util':
                        // Minimal util shim for Node.js util functions
                        return { 
                            inherits: (child, parent) => {
                                child.prototype = Object.create(parent.prototype);
                                child.prototype.constructor = child;
                            },
                            isArray: Array.isArray,
                            isString: (obj) => typeof obj === 'string',
                            isFunction: (obj) => typeof obj === 'function'
                        };
                    case 'stream':
                        // Minimal stream shim
                        return {
                            Readable: class Readable {},
                            Writable: class Writable {},
                            Transform: class Transform {}
                        };
                    case 'https':
                    case 'process':
                        throw new Error(`require('${name}') not allowed in browser context. Use IPC instead.`);
                    default:
                        throw new Error(`require('${name}') called in browser context - not implemented`);
                }
            };
            
            // Create minimal module.exports and exports for compatibility
            if (typeof module === 'undefined') {
                window.module = { exports: {} };
            }
            if (typeof exports === 'undefined') {
                window.exports = window.module.exports;
            }
            
            console.log('[UI] Require and module shims loaded');
        </script>

        <!-- Load Smoothie Charts for graphs -->
        <script>
            // Ensure exports points to window for Smoothie
            // Save current state
            var savedExports = window.exports;
            var savedModuleExports = window.module ? window.module.exports : undefined;
            
            // Set up exports to point to window for Smoothie loading
            window.exports = window;
            if (window.module) {
                window.module.exports = window;
            }
        </script>
        <script src="node_modules/smoothie/smoothie.js"></script>
        <script>
            // Restore original exports state after Smoothie loads
            window.exports = savedExports;
            if (window.module) {
                window.module.exports = savedModuleExports;
            }
            
            console.log('[UI] Smoothie charts available:', typeof SmoothieChart);
            console.log('[UI] TimeSeries available:', typeof TimeSeries);
        </script>
        
        <!-- Load mime-db and mime-types for file type detection -->
        <script>
            // Load mime-db JSON data
            fetch('./node_modules/mime-db/db.json')
                .then(response => response.json())
                .then(data => {
                    window.mimeDb = data;
                    console.log('[UI] Mime database loaded');
                })
                .catch(err => {
                    console.warn('[UI] Could not load mime database:', err);
                    window.mimeDb = {};
                });
        </script>
        <script src="node_modules/mime-types/index.js"></script>
        <script>
            // Expose mime-types globally
            if (typeof mimeTypes !== 'undefined') {
                window.mimeTypes = mimeTypes;
            } else if (typeof module !== 'undefined' && module.exports) {
                window.mimeTypes = module.exports;
                module.exports = {}; // Reset for next module
                window.exports = module.exports; // Reset exports too
            }
        </script>

        </script>
